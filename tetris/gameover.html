<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME OVER</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: 'Press Start 2P', cursive;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: red;
            font-weight: bold;
            opacity: 0;
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
</head>
<body>
<div id="game-over">GAME&nbsp;OVER<br><br>PUNTOS&nbsp;{{.Points}}</div>

<p id="result-title"></p>
<p id="status">Esperando al otro jugador...</p>

<script>
    const MULTIPLAYER_SERVER = "{{.multiplayerServer}}";

    const gameOverText = document.getElementById("game-over");
    const text = gameOverText.innerText;
    const playerId = "{{.PlayerID}}";

    const draw = "¡EMPATE!";
    const win = "¡GANASTE!";
    const lose = "¡PERDISTE!";

    gameOverText.innerText = "";

    function showLetters() {
        for (let i = 0; i < text.length; i++) {
            setTimeout(() => {
                gameOverText.innerText += text[i];
            }, i * 100); // Cambia la velocidad de aparición ajustando el valor 200 (milisegundos)
        }
    }

    async function checkMatch() {
        const response = await fetch(MULTIPLAYER_SERVER + '/match');

        if (!response.ok) {
            console.error('Error obteniendo el estado del juego:', response.statusText);
            return;
        }

        const match = await response.json();

      if (match.status !== 'finished') {
          return;
      }

      clearInterval(intervalId);  // Detener el intervalo si el juego ha terminado

      showResult(match);
    }


    function showResult(match) {
        const title = document.getElementById("result-title");
        const status = document.getElementById("status");

        if (match.result === 'draw') {
            title.textContent = draw;
        } else if (match.result === playerId) {
            title.textContent = win;
        } else {
            title.textContent = lose;
        }

        status.textContent = `${match.player1.name}: ${match.player1.points} - ${match.player2.name}: ${match.player2.points}`;
    }

    setTimeout(() => {
        gameOverText.style.opacity = 1;
        showLetters();
    }, 500); // Espera 2 segundos antes de mostrar las letras

    const intervalId = setInterval(checkMatch, 1000); // Verifica el estado del juego cada segundo
    checkMatch();
</script>
</body>
</html>
